# Local Postgres for LangGraph checkpoints (optional).
# Usage:
#   docker compose up -d
#   $env:DATABASE_URL = 'postgresql://rag:rag@127.0.0.1:5432/rag_checkpoints'
#   uv run uvicorn api:app --reload --port 8000
#
# Without DATABASE_URL, CLI/API keep using checkpoints.sqlite.

services:
  postgres:
    image: postgres:16
    container_name: langchain-rag-pg
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag_checkpoints
    ports:
      - '5432:5432'
    volumes:
      - rag_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rag -d rag_checkpoints']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rag_pg_data:
