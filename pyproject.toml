[project]
name = 'langchain-rag'
version = '0.1.0'
description = 'Local RAG learning repo (Ollama + Chroma), separate from langchain-first-chain'
readme = 'README.md'
authors = [
  { name = 'marcus.sze', email = 'szeyulam1028@gmail.com' },
]
requires-python = '>=3.10'
dependencies = [
  'langchain>=1.0.0',
  'langchain-core>=1.0.0',
  'langchain-ollama>=0.3.0',
  'langchain-text-splitters>=0.3.0',
  'langchain-chroma>=0.2.0',
]

[project.scripts]
langchain-rag = 'langchain_rag:main'

[build-system]
requires = ['uv_build>=0.13.7,<0.14.0']
build-backend = 'uv_build'
