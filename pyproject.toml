[project]
name = 'langchain-rag'
version = '0.1.0'
description = 'Local RAG learning repo (Ollama + Chroma), separate from langchain-first-chain'
readme = 'README.md'
authors = [
  { name = 'marcus.sze', email = 'szeyulam1028@gmail.com' },
]
requires-python = '>=3.10'
dependencies = [
  'langchain>=1.0.0',
  'langchain-core>=1.0.0',
  'langchain-ollama>=0.3.0',
  'langchain-text-splitters>=0.3.0',
  'langchain-chroma>=0.2.0',
  'langgraph>=1.0.0',
  'langgraph-checkpoint-sqlite>=2.0.0',
  "langgraph-checkpoint-postgres>=2.0.0",
  "psycopg[binary,pool]>=3.0.0",
]

[dependency-groups]
dev = [
  'langgraph-cli[inmem]',
  # Windows: langgraph-api ConsoleRenderer needs colorama
  'colorama',
]
api = [
  'fastapi>=0.115.0',
  'uvicorn[standard]>=0.32.0',
]

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

# Flat layout: ship root modules so langgraph.json dependencies ["."] can install.
[tool.hatch.build.targets.wheel]
only-include = [
  'index_store.py',
  'rag.py',
  'graph_rag.py',
  'graph_server.py',
  'graph_chat.py',
  'compare_retrieve.py',
  'api.py',
  'checkpoint_store.py',
]
